            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;

            background: var(--card-bg);
            padding: 12px 18px;
            border-radius: var(--radius);
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border-color);

            color: var(--text-muted);

            align-items: center;

            font-weight: 600;

            border-radius: 8px;
            border: none;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;

            height: 11px;
            border: solid white;
            border-width: 0 2.5px 2.5px 0;
            transform: rotate(45deg);
            margin-bottom: 2px;

            margin-left: -5px;

            border-radius: 8px;

            display: inline-flex;

            gap: 6px;

            }
            .category-card {
                box-shadow: none;
                border: 1px solid #cbd5e1;

            }
        }

            .main-title {
                font-size: 1.45rem;
            }

                padding-right: 15px;
            }

</head>

                    {
                        id: "r_11",
                        title: "রুল ১১: দৈনিক শৃঙ্খলার ব্যাঘাত নোট ও সমাধান (Daily Discipline Audit):",
                        desc: "রুলস ও রুটিন সুশৃঙ্খলভাবে পরিচালনায় কোন কোন সমস্যা বা বিষয়গুলো ব্যাঘাত ঘটাচ্ছে, তা নিয়মিত ডায়েরিতে নোট করা। প্রতিদিন নির্দিষ্ট সময়টিতে সেই চিহ্নিত সমস্যাগুলোর স্থায়ী সমাধান বের করা।",
                        completed: false
                    }
                ]
            }
        ]
    };

    const STORAGE_KEY = "lifetime_identity_rules_v1";
    let appData = loadData();

    function loadData() {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
            try {
                return JSON.parse(saved);
            } catch (e) {
                return JSON.parse(JSON.stringify(defaultData));
            }
        }
        return JSON.parse(JSON.stringify(defaultData));
    }

    function saveData() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(appData));
        updateProgress();
    }

    function render() {
        document.getElementById("mainTitle").innerText = appData.title;
        document.getElementById("subTitle").innerText = appData.subtitle;

        const container = document.getElementById("checklistContainer");
        container.innerHTML = "";

        appData.categories.forEach((cat, catIndex) => {
            const card = document.createElement("section");
            card.className = "category-card";

            const header = document.createElement("div");
            header.className = "category-header";
            header.innerHTML = `
                <div class="category-title-area">
                    <h2 class="category-title" contenteditable="true" spellcheck="false" 
                        onblur="updateCategoryField(${catIndex}, 'title', this.innerText)">${escapeHtml(cat.title)}</h2>
                    <p class="category-purpose" contenteditable="true" spellcheck="false" 
                        onblur="updateCategoryField(${catIndex}, 'purpose', this.innerText)">${escapeHtml(cat.purpose)}</p>
                </div>
                <button class="icon-btn" title="এই ক্যাটাগরিটি মুছে ফেলুন" onclick="deleteCategory(${catIndex})">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="3 6 5 6 21 6"></polyline>
                        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                    </svg>
                </button>
            `;
            card.appendChild(header);

            const ul = document.createElement("ul");
            ul.className = "rules-list";

            cat.rules.forEach((rule, ruleIndex) => {
                const li = document.createElement("li");
                li.className = `rule-item ${rule.completed ? "completed" : ""}`;
                li.innerHTML = `
                    <div class="checkbox-wrapper">
                        <input type="checkbox" class="custom-checkbox" ${rule.completed ? "checked" : ""} 
                            onchange="toggleRule(${catIndex}, ${ruleIndex})">
                    </div>
                    <div class="rule-content">
                        <div class="rule-title" contenteditable="true" spellcheck="false" 
                            onblur="updateRuleField(${catIndex}, ${ruleIndex}, 'title', this.innerText)">${escapeHtml(rule.title)}</div>
                        <div class="rule-desc" contenteditable="true" spellcheck="false" 
                            onblur="updateRuleField(${catIndex}, ${ruleIndex}, 'desc', this.innerText)">${escapeHtml(rule.desc)}</div>
                    </div>
                    <button class="icon-btn" title="এই রুলটি মুছে ফেলুন" onclick="deleteRule(${catIndex}, ${ruleIndex})">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="18" y1="6" x2="6" y2="18"></line>
                            <line x1="6" y1="6" x2="18" y2="18"></line>
                        </svg>
                    </button>
                `;
                ul.appendChild(li);
            });
            card.appendChild(ul);

            const footer = document.createElement("div");
            footer.className = "category-footer";
            footer.innerHTML = `
                <button class="btn-add-rule" onclick="addRule(${catIndex})">+ নতুন রুল যুক্ত করুন</button>
            `;
            card.appendChild(footer);

            container.appendChild(card);
        });

        updateProgress();
    }

    document.getElementById("mainTitle").addEventListener("blur", function() {
        appData.title = this.innerText.trim() || "শিরোনামহীন চেকলিস্ট";
        saveData();
    });

    document.getElementById("subTitle").addEventListener("blur", function() {
        appData.subtitle = this.innerText.trim() || "সাব-টাইটেল লিখুন";
        saveData();
    });

    function updateCategoryField(catIndex, field, value) {
        appData.categories[catIndex][field] = value.trim();
        saveData();
    }

    function updateRuleField(catIndex, ruleIndex, field, value) {
        appData.categories[catIndex].rules[ruleIndex][field] = value.trim();
        saveData();
    }

    function toggleRule(catIndex, ruleIndex) {
        appData.categories[catIndex].rules[ruleIndex].completed = !appData.categories[catIndex].rules[ruleIndex].completed;
        saveData();
        render();
    }

    function addCategory() {
        appData.categories.push({
            id: "cat_" + Date.now(),
            title: "নতুন ক্যাটাগরির নাম (ক্লিক করে এডিট করুন)",
            purpose: "উদ্দেশ্য: এই ক্যাটাগরির মূল লক্ষ্য এখানে লিখুন।",
            rules: [
                {
                    id: "r_" + Date.now(),
                    title: "নতুন রুল:",
                    desc: "এখানে রুলের বিস্তারিত নিয়ম লিখুন।",
                    completed: false
                }
            ]
        });
        saveData();
        render();
        window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
    }

    function deleteCategory(catIndex) {
        if (confirm("আপনি কি নিশ্চিতভাবে এই পুরো ক্যাটাগরি এবং এর ভেতরের সব রুল মুছে ফেলতে চান?")) {
            appData.categories.splice(catIndex, 1);
            saveData();
            render();
        }
    }

    function addRule(catIndex) {
        const nextNum = appData.categories.reduce((acc, c) => acc + c.rules.length, 0) + 1;
        appData.categories[catIndex].rules.push({
            id: "r_" + Date.now(),
            title: `রুল ${nextNum}: নতুন রুলের শিরোনাম:`,
            desc: "এখানে রুলটির বিস্তারিত বিবরণ লিখুন।",
            completed: false
        });
        saveData();
        render();
    }

    function deleteRule(catIndex, ruleIndex) {
        if (confirm("এই রুলটি কি মুছে ফেলতে চান?")) {
            appData.categories[catIndex].rules.splice(ruleIndex, 1);
            saveData();
            render();
        }
    }

    function uncheckAll() {
        appData.categories.forEach(cat => {
            cat.rules.forEach(rule => rule.completed = false);
        });
        saveData();
        render();
    }

    function resetToDefault() {
        if (confirm("সতর্কতা: আপনার করা সব পরিবর্তন মুছে গিয়ে একদম শুরুর ডিফল্ট চেকলিস্ট ফিরে আসবে। আপনি কি নিশ্চিত?")) {
            localStorage.removeItem(STORAGE_KEY);
            appData = JSON.parse(JSON.stringify(defaultData));
            saveData();
            render();
        }
    }

    function updateProgress() {
        let total = 0;
        let completed = 0;

        appData.categories.forEach(cat => {
            cat.rules.forEach(rule => {
                total++;
                if (rule.completed) completed++;
            });
        });

        const percent = total === 0 ? 0 : Math.round((completed / total) * 100);
        document.getElementById("progressText").innerText = `আজকের অগ্রগতি: ${toBengaliNumber(completed)} / ${toBengaliNumber(total)} সম্পন্ন`;
        document.getElementById("progressPercent").innerText = `${percent}%`;
        document.getElementById("progressFill").style.width = `${percent}%`;
    }

    function toBengaliNumber(num) {
        const bnDigits = ['০', '১', '২', '৩', '৪', '৫', '৬', '৭', '৮', '৯'];
        return num.toString().replace(/\d/g, d => bnDigits[d]);
    }

    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    render();
</script>

</body>
</html>
